name: MCP Server CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'mcp-server/**'
      - '.github/workflows/mcp-ci.yml'
  pull_request:
    paths:
      - 'mcp-server/**'
      - '.github/workflows/mcp-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Use minimal matrix for PRs, full matrix for main/develop
        node-version: ${{ github.event_name == 'pull_request' && fromJSON('["20"]') || fromJSON('["18", "20", "22"]') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: mcp-server/package-lock.json

      - name: Install dependencies
        working-directory: ./mcp-server
        run: npm ci

      - name: Build
        working-directory: ./mcp-server
        run: npm run build

  publish:
    name: Publish to npm
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: npm-publish
    permissions:
      id-token: write
      contents: write  # Required to push git tags

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for OIDC support
        run: npm install -g npm@latest

      - name: Check if version changed
        id: version-check
        run: |
          CURRENT_VERSION=$(node -p "require('./mcp-server/package.json').version")
          PREVIOUS_VERSION=$(git show HEAD^:mcp-server/package.json | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin', 'utf8')).version")

          if [ "$CURRENT_VERSION" != "$PREVIOUS_VERSION" ]; then
            echo "Version changed from $PREVIOUS_VERSION to $CURRENT_VERSION"
            echo "should_publish=true" >> $GITHUB_OUTPUT
            echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          else
            echo "Version unchanged: $CURRENT_VERSION"
            echo "should_publish=false" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        if: steps.version-check.outputs.should_publish == 'true'
        working-directory: ./mcp-server
        run: npm ci

      - name: Publish to npm
        if: steps.version-check.outputs.should_publish == 'true'
        working-directory: ./mcp-server
        run: npm publish --provenance --access public --ignore-scripts

      - name: Create release tag
        if: steps.version-check.outputs.should_publish == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "mcp-v${{ steps.version-check.outputs.version }}" -m "MCP Server v${{ steps.version-check.outputs.version }}"
          git push origin "mcp-v${{ steps.version-check.outputs.version }}"

      - name: Create GitHub Release
        if: steps.version-check.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "mcp-v${{ steps.version-check.outputs.version }}" \
            --title "MCP Server v${{ steps.version-check.outputs.version }}" \
            --generate-notes \
            --notes-start-tag "$(git tag -l 'mcp-v*' --sort=-v:refname | sed -n '2p')"
