name: Trigger Monorepo SDK Sync

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  dispatch-monorepo-sync:
    name: Dispatch monorepo inbound sync
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify monorepo sync token
        env:
          MONOREPO_SYNC_TOKEN: ${{ secrets.MONOREPO_SYNC_TOKEN }}
        run: |
          if [ -z "$MONOREPO_SYNC_TOKEN" ]; then
            echo "::error::MONOREPO_SYNC_TOKEN must be configured to trigger inbound sync in nebula-agi/nebula."
            exit 1
          fi
          # Use a dedicated token with Actions: write on nebula-agi/nebula only.

      - name: Trigger monorepo inbound sync workflow
        env:
          MONOREPO_SYNC_TOKEN: ${{ secrets.MONOREPO_SYNC_TOKEN }}
        run: |
          curl -fsSL \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $MONOREPO_SYNC_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/nebula-agi/nebula/actions/workflows/sync-sdk-inbound.yml/dispatches \
            -d @- <<EOF
          {
            "ref": "main",
            "inputs": {
              "source_event": "${GITHUB_EVENT_NAME}",
              "source_ref": "${GITHUB_REF_NAME}",
              "source_repo": "${GITHUB_REPOSITORY}",
              "source_sha": "${GITHUB_SHA}"
            }
          }
          EOF
